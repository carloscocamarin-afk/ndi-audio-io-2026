name: Build Windows

on:
  # Se ejecuta cada vez que subes cambios a la rama principal...
  push:
    branches: [main]
  # ...o manualmente: pestana Actions > "Build Windows" > Run workflow
  workflow_dispatch:

permissions:
  contents: read

env:
  BUILD_TYPE: Release

jobs:
  windows:
    name: Compilar para Windows
    runs-on: windows-2022

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar CMake
        run: cmake -B Build -G "Visual Studio 17 2022" -A x64 -D NO_ASIO=ON

      - name: Compilar
        run: cmake --build Build --config ${{ env.BUILD_TYPE }} --parallel 4

      # Instalador (.exe) generado con CPack/NSIS. Si falla, el .exe suelto
      # de la app se sube igual en el paso siguiente.
      - name: Crear instalador
        continue-on-error: true
        working-directory: Build
        run: cpack -C ${{ env.BUILD_TYPE }}

      - name: Subir app (.exe suelto)
        uses: actions/upload-artifact@v4
        with:
          name: NDI-Audio-IO-exe
          path: Build/NDI-Audio-IO_artefacts/${{ env.BUILD_TYPE }}/Standalone/*.exe
          if-no-files-found: error

      - name: Subir instalador
        uses: actions/upload-artifact@v4
        with:
          name: NDI-Audio-IO-instalador
          path: Build/cpack/*.exe
          if-no-files-found: warn
